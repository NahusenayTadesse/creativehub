<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>

	<!--
		`hover` already covers a phone: SvelteKit starts preloading on `touchstart`
		where there is no pointer to hover, so `tap` would fire at the same moment
		on mobile and strictly later on desktop.

		What a phone does gain is `preload-code="viewport"`, which fetches the
		*code* for every link already on screen — a directory page is two dozen
		creator cards, and the tap that follows then has only data left to wait
		for. Both are ignored when the reader has asked for reduced data usage.
	-->
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
